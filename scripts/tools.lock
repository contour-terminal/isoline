# The spec suites scripts/import-spec-tests.py imports, one source per name that tests/spec/files.txt
# rows start with: `source.<name>.repository` and the `source.<name>.commit` imported.

# The WebAssembly 3.0 release: the commit the tag wg-3.0 names.
source.wasm3.repository = https://github.com/WebAssembly/spec
source.wasm3.commit = 9d36019973201a19f9c9ebb0f10828b2fe2374aa

# The proposals beyond 3.0 that Isoline implements, each its repository's suite at the commit
# imported (docs/conformance.md lists them with the feature they test).
source.wide-arithmetic.repository = https://github.com/WebAssembly/wide-arithmetic
source.wide-arithmetic.commit = 024d4ce1b28cee7fd006d9c5175e3b7ece52b429
source.custom-page-sizes.repository = https://github.com/WebAssembly/custom-page-sizes
source.custom-page-sizes.commit = 61c873a1860acad2772539164f284cc5110f1b1b
source.compact-imports.repository = https://github.com/WebAssembly/compact-import-section
source.compact-imports.commit = 0624de829e2663da799e708444dec80337a3fe54

# The GC cut: the language Isoline accepts is what the pinned wasm-tools validates with these
# features, the 3.0 release without GC plus the proposals above. scripts/import-spec-tests.py skips
# every module it rejects for GC, and the commands that use one, in the files of every source.
cut.features = wasm3,-gc,wide-arithmetic,compact-imports,custom-page-sizes

# The component model's suites (D12), imported by `scripts/import-spec-tests.py --suite component` under
# the rows of tests/component-files.txt: `source.<name>.tests` is the directory of the source's .wast files,
# and `source.<name>.features-from` says where a file's wasm-tools features come from: its `;; RUN:` line
# (run-line), its Wasmtime `;;!` directives (directives), or `source.<name>.features` (lock).
source.component-model.repository = https://github.com/WebAssembly/component-model
source.component-model.commit = f78ac03c178ad0f51b307852087792f1f164dc34
source.component-model.tests = test
source.component-model.features-from = lock
# The features test/README.md runs the reference tests with, as Wasmtime's `-W` flags name them.
source.component-model.features = cm-more-async-builtins,cm-threading,cm-async-stackful,cm-implements,cm-fixed-length-lists,cm-map
# The wasm-tools release the oracle is (wasm-tools.version above).
source.component-wasm-tools.repository = https://github.com/bytecodealliance/wasm-tools
source.component-wasm-tools.commit = 7a2fa422cdf9aeeaf488a2acac8bc94a078bfa32
source.component-wasm-tools.tests = tests/cli/component-model
source.component-wasm-tools.features-from = run-line
# Wasmtime 51.0.0.
source.component-wasmtime.repository = https://github.com/bytecodealliance/wasmtime
source.component-wasmtime.commit = 32656dc4873fcec5c8662aa937bd01acda3b2e85
source.component-wasmtime.tests = tests/misc_testsuite/component-model
source.component-wasmtime.features-from = directives

# The component cut: the language Isoline's component layer accepts is what the pinned wasm-tools validates
# with these features: the core cut, less the shared memories of threads (which the core suites never
# reach, and Isoline does not implement), with the component model and the two gates Isoline implements
# (src/isoline/component/Features.hpp); every other gate is off, as `wasm3` resets them. A command whose
# verdict the cut changes is skipped for the gate (or core feature) that gives the suite's verdict back.
component.cut.features = wasm3,-gc,-threads,wide-arithmetic,compact-imports,custom-page-sizes,component-model,cm-map,cm-implements
