# The x86-64 encoding oracle's disassembler (scripts/check-encodings.py, tests/encoding): only bin/llvm-mc of the
# LLVM release is extracted. 22.1.8 is the LLVM the lint lanes pin (one LLVM release for the repository's LLVM
# tools), and the one tests/encoding/x86_64.golden was checked with. The SHA-256 is of the archive whose detached
# signature (.sig) verified against releases.llvm.org's release keys (Douglas Yung's,
# FFB3368980F3E6BB5737145A316C56D064CACBA5) on 2026-11-27, and equals the digest GitHub reports for the asset.
llvm-mc.version = 22.1.8
llvm-mc.url = https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/{archive}
llvm-mc.archive.x86_64-linux = LLVM-{version}-Linux-X64.tar.xz
llvm-mc.executable.x86_64-linux = LLVM-{version}-Linux-X64/bin/llvm-mc
llvm-mc.members.x86_64-linux = LLVM-{version}-Linux-X64/bin/llvm-mc
llvm-mc.sha256.x86_64-linux = df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384

# The WAMR the benchmarks compare with: Contour's pin (cmake/ContourThirdParties.cmake), built from source
# with Contour's patches, so it is a source archive rather than a tool: no `wamr.version` row, which would
# make it one (fetch-tools.py fetches tools by their `.version` rows).
wamr.release = 2.4.5
wamr.commit = 25bd7eb63e828e4bd242cc9b38d260b4b31c6605
wamr.source.url = https://github.com/bytecodealliance/wasm-micro-runtime/archive/{commit}.tar.gz
wamr.source.sha256 = 4ea552d9d979f3c3d5f9e298a1594150820d2b76e8328ad68779578edea7a873

# The spec suites scripts/import-spec-tests.py imports, one source per name that tests/spec/files.txt
# rows start with: `source.<name>.repository` and the `source.<name>.commit` imported.

# The WebAssembly 3.0 release: the commit the tag wg-3.0 names.
source.wasm3.repository = https://github.com/WebAssembly/spec
source.wasm3.commit = 9d36019973201a19f9c9ebb0f10828b2fe2374aa

# The proposals beyond 3.0 that Isoline implements, each its repository's suite at the commit
# imported (docs/conformance.md lists them with the feature they test).
source.wide-arithmetic.repository = https://github.com/WebAssembly/wide-arithmetic
source.wide-arithmetic.commit = 024d4ce1b28cee7fd006d9c5175e3b7ece52b429
source.custom-page-sizes.repository = https://github.com/WebAssembly/custom-page-sizes
source.custom-page-sizes.commit = 61c873a1860acad2772539164f284cc5110f1b1b
source.compact-imports.repository = https://github.com/WebAssembly/compact-import-section
source.compact-imports.commit = 0624de829e2663da799e708444dec80337a3fe54

# The GC cut: the language Isoline accepts is what the pinned wasm-tools validates with these
# features, the 3.0 release without GC plus the proposals above. scripts/import-spec-tests.py skips
# every module it rejects for GC, and the commands that use one, in the files of every source.
cut.features = wasm3,-gc,wide-arithmetic,compact-imports,custom-page-sizes
