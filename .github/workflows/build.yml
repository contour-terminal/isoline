name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # The LLVM toolchain every Linux Clang job, clang-tidy and clang-format use.
  LLVM_VERSION: "22"
  GCC_VERSION: "14"

jobs:
  linux-clang-asan:
    name: Linux Clang (ASan + UBSan, clang-tidy)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy "clang-tidy-$LLVM_VERSION" ninja-build
      - name: Configure
        run: >
          cmake --preset clang-asan
          -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DISOLINE_CLANG_TIDY_EXE="/usr/bin/clang-tidy-$LLVM_VERSION"
          -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset clang-asan
      - name: Test
        run: ctest --preset clang-asan --output-on-failure

  linux-clang-tsan:
    name: Linux Clang (TSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy ninja-build
      - name: Configure
        # clang-tidy runs in the ASan job already.
        run: >
          cmake --preset clang-tsan
          -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DISOLINE_CLANG_TIDY=OFF
          -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset clang-tsan
      - name: Test
        # TSan's shadow mapping cannot take the runner kernel's full mmap randomisation.
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          ctest --preset clang-tsan -L unit --output-on-failure

  linux-gcc:
    name: Linux GCC (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Release too: its optimizer raises warnings, -Wmaybe-uninitialized among them, Debug does not.
        preset: [gcc-debug, gcc-release]
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC ${{ env.GCC_VERSION }} and Ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy "g++-$GCC_VERSION" ninja-build
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER="g++-$GCC_VERSION" -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  linux-clang-coverage:
    name: Linux Clang (coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy "clang-tidy-$LLVM_VERSION" ninja-build
      - name: Configure
        run: >
          cmake --preset clang-coverage
          -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DISOLINE_CLANG_TIDY_EXE="/usr/bin/clang-tidy-$LLVM_VERSION"
          -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset clang-coverage
      - name: Test
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/out/clang-coverage/profiles/%p.profraw
        run: ctest --preset clang-coverage --output-on-failure
      - name: Coverage report
        working-directory: out/clang-coverage
        run: |
          "llvm-profdata-$LLVM_VERSION" merge -sparse profiles/*.profraw -o isoline.profdata
          # The unit tests and the spec runner both exercise src/isoline/; the ratchet covers it alone.
          # llvm-cov warns "N functions have mismatched data", which is benign: a binary that includes a
          # header's inline or constexpr function without emitting it (it calls none, or only in constant
          # evaluation, as the spec runner does FeatureSet::all()) carries clang's
          # placeholder record for it, of hash 0 and all counts zero, while the profile holds the record of
          # the binaries that do emit it. llvm-cov drops the placeholder and keeps the real counts.
          objects=(src/isoline/isoline_test -object tests/spec/isoline_spec_runner
                   -object tests/spec/isoline_spectest_test -object src/isoline/text/isoline_text_test
                   -object src/isoline/cli/isoline_cli_test -object src/isoline/cli/isoline)
          ignore='vendor/|_deps/|^/usr/|_test\.cpp$|/out/|/tests/|/testing/'
          "llvm-cov-$LLVM_VERSION" report "${objects[@]}" -instr-profile=isoline.profdata \
            -ignore-filename-regex="$ignore" | tee coverage-summary.txt
          "llvm-cov-$LLVM_VERSION" export "${objects[@]}" -instr-profile=isoline.profdata \
            -ignore-filename-regex="$ignore" -format=text > coverage.json
          "llvm-cov-$LLVM_VERSION" export "${objects[@]}" -instr-profile=isoline.profdata \
            -ignore-filename-regex="$ignore" -format=lcov > coverage.lcov
          "llvm-cov-$LLVM_VERSION" show "${objects[@]}" -instr-profile=isoline.profdata \
            -ignore-filename-regex="$ignore" -format=html -output-dir=coverage-html
      - name: Coverage ratchet
        run: python3 -I scripts/coverage-check.py out/clang-coverage/coverage.json coverage-baseline.txt
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            out/clang-coverage/coverage-summary.txt
            out/clang-coverage/coverage.lcov
            out/clang-coverage/coverage-html

  linux-clang-differential:
    name: Linux Clang (differential corpus, Wasmtime oracle)
    runs-on: ubuntu-24.04
    # The replay took 30 minutes locally (clang-release, a loaded machine); the oracle adds a process per call.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy ninja-build
      - name: Fetch the pinned wasm-tools and Wasmtime
        run: |
          python3 -I scripts/fetch-tools.py --tool wasm-tools
          echo "ISOLINE_WASMTIME=$(python3 -I scripts/fetch-tools.py --tool wasmtime)" >> "$GITHUB_ENV"
      # The corpus is a function of the pinned wasm-tools and the generator alone, so it is cached by
      # their hashes and generated only when either changes.
      - name: Restore the differential corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: out/corpus/differential
          key: differential-corpus-${{ hashFiles('scripts/tools.lock', 'scripts/make-differential-corpus.py') }}
      - name: Generate the differential corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: python3 -I scripts/make-differential-corpus.py --seeds 10000
      - name: Configure
        # clang-tidy runs in the ASan job already.
        run: >
          cmake --preset clang-release
          -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DISOLINE_CLANG_TIDY=OFF
          -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset clang-release --target isoline_differential_test isoline-differential-replay
      - name: Replay the corpus on every engine
        run: ctest --test-dir out/clang-release -L differential --output-on-failure

  macos-clang:
    name: macOS Apple Clang
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset macos-clang
      - name: Build
        run: cmake --build --preset macos-clang
      - name: Test
        run: ctest --preset macos-clang --output-on-failure

  windows-msvc:
    name: Windows MSVC
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enter the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset msvc-debug
      - name: Build
        run: cmake --build --preset msvc-debug
      - name: Test
        run: ctest --preset msvc-debug --output-on-failure

  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format ${{ env.LLVM_VERSION }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy "clang-format-$LLVM_VERSION"
      - name: Check formatting
        run: |
          dirs=()
          for dir in src tests; do
            if [ -d "$dir" ]; then dirs+=("$dir"); fi
          done
          find "${dirs[@]}" \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 "clang-format-$LLVM_VERSION" --dry-run --Werror

  vendor-check:
    name: Vendored core-cpp matches its MANIFEST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check vendor/core-cpp
        run: cmake -DMODE=check -DDEST=vendor/core-cpp -P vendor/core-cpp/cmake/CoreCppVendor.cmake
