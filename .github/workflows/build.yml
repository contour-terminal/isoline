name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      differential-sample:
        description: "Lane 2 and the oracle replay the corpus seeds divisible by this (1: everything, as nightly)"
        required: false
        default: "8"

concurrency:
  # A dispatch measuring the nightly differential sample does not cancel the pull request's run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.differential-sample || '8' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # The LLVM toolchain every Linux Clang job, clang-tidy and clang-format use.
  LLVM_VERSION: "22"
  GCC_VERSION: "14"

jobs:
  # One row per Linux architecture: x86-64, and arm64 natively on GitHub's Cobalt 100 runners (PAC, BTI;
  # weak memory ordering and instruction-cache rules that qemu cannot show).
  linux-clang-asan:
    name: Linux Clang (ASan + UBSan, clang-tidy)${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, suffix: "" }
          - { runner: ubuntu-24.04-arm, suffix: " arm64" }
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy "clang-tidy-$LLVM_VERSION" ninja-build
      - name: Configure
        run: >
          cmake --preset clang-asan
          -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DISOLINE_CLANG_TIDY_EXE="/usr/bin/clang-tidy-$LLVM_VERSION"
          -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset clang-asan
      - name: Test
        run: ctest --preset clang-asan --output-on-failure

  linux-clang-tsan:
    name: Linux Clang (TSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy ninja-build
      - name: Configure
        # clang-tidy runs in the ASan job already.
        run: >
          cmake --preset clang-tsan
          -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DISOLINE_CLANG_TIDY=OFF
          -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset clang-tsan
      - name: Test
        # TSan's shadow mapping cannot take the runner kernel's full mmap randomisation.
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          ctest --preset clang-tsan -L unit --output-on-failure

  linux-gcc:
    name: Linux GCC (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Release too: its optimizer raises warnings, -Wmaybe-uninitialized among them, Debug does not.
        preset: [gcc-debug, gcc-release]
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC ${{ env.GCC_VERSION }} and Ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy "g++-$GCC_VERSION" ninja-build
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER="g++-$GCC_VERSION" -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # The ratchet is x86-64's (coverage-baseline.txt); the arm64 row's report covers the files only arm64
  # builds (its CPU feature probes) and is uploaded for merging with it.
  linux-clang-coverage:
    name: Linux Clang (coverage)${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, suffix: "", artifact: coverage-report, ratchet: true }
          - { runner: ubuntu-24.04-arm, suffix: " arm64", artifact: coverage-report-arm64, ratchet: false }
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy "clang-tidy-$LLVM_VERSION" ninja-build
      - name: Configure
        run: >
          cmake --preset clang-coverage
          -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DISOLINE_CLANG_TIDY_EXE="/usr/bin/clang-tidy-$LLVM_VERSION"
          -DISOLINE_FETCH_DEPS=ON
      - name: Build
        run: cmake --build --preset clang-coverage
      - name: Test
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/out/clang-coverage/profiles/%p.profraw
        run: ctest --preset clang-coverage --output-on-failure
      - name: Coverage report
        working-directory: out/clang-coverage
        run: |
          "llvm-profdata-$LLVM_VERSION" merge -sparse profiles/*.profraw -o isoline.profdata
          # The unit tests and the spec runner both exercise src/isoline/; the ratchet covers it alone.
          # llvm-cov warns "N functions have mismatched data", which is benign: a binary that includes a
          # header's inline or constexpr function without emitting it (it calls none, or only in constant
          # evaluation, as the spec runner does FeatureSet::all()) carries clang's
          # placeholder record for it, of hash 0 and all counts zero, while the profile holds the record of
          # the binaries that do emit it. llvm-cov drops the placeholder and keeps the real counts.
          objects=(src/isoline/isoline_test -object tests/spec/isoline_spec_runner
                   -object tests/spec/isoline_spectest_test -object src/isoline/text/isoline_text_test
                   -object src/isoline/cli/isoline_cli_test -object src/isoline/cli/isoline)
          ignore='vendor/|_deps/|^/usr/|_test\.cpp$|/out/|/tests/|/testing/'
          "llvm-cov-$LLVM_VERSION" report "${objects[@]}" -instr-profile=isoline.profdata \
            -ignore-filename-regex="$ignore" | tee coverage-summary.txt
          "llvm-cov-$LLVM_VERSION" export "${objects[@]}" -instr-profile=isoline.profdata \
            -ignore-filename-regex="$ignore" -format=text > coverage.json
          "llvm-cov-$LLVM_VERSION" export "${objects[@]}" -instr-profile=isoline.profdata \
            -ignore-filename-regex="$ignore" -format=lcov > coverage.lcov
          "llvm-cov-$LLVM_VERSION" show "${objects[@]}" -instr-profile=isoline.profdata \
            -ignore-filename-regex="$ignore" -format=html -output-dir=coverage-html
      - name: Coverage ratchet
        if: ${{ matrix.ratchet }}
        run: python3 -I scripts/coverage-check.py out/clang-coverage/coverage.json coverage-baseline.txt
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/clang-coverage/coverage-summary.txt
            out/clang-coverage/coverage.lcov
            out/clang-coverage/coverage-html

  # The differential corpus on every engine (differential.yml): on a pull request lane 1 replays every
  # module and lane 2 and the Wasmtime oracle an eighth; the nightly run (differential-nightly.yml) all.
  linux-clang-differential:
    name: Linux Clang (differential corpus, Wasmtime oracle)
    uses: ./.github/workflows/differential.yml
    with:
      sample: ${{ fromJSON(inputs.differential-sample || '8') }}

  # The x86-64 encoding oracle (tests/encoding, scripts/check-encodings.py): llvm-mc must read every sample of
  # Encodings.def as the instruction it is meant to be. Only bin/llvm-mc of the pinned LLVM release is
  # extracted, and the extracted tree is cached by the lock, so the ~2 GB archive is fetched once per change
  # of scripts/tools.lock. A failed fetch or check fails the job, and --no-tests=error fails it when the
  # oracle's test is not registered: it never passes by running nothing.
  linux-encoding-oracle:
    name: Linux x86-64 encodings (llvm-mc oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} and Ninja
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy ninja-build
      - name: Key the pinned llvm-mc
        id: llvm-mc-key
        run: |
          set -euo pipefail
          echo "version=$(python3 -I scripts/fetch-tools.py --tool llvm-mc --print-version)" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned llvm-mc
        uses: actions/cache@v4
        with:
          path: ~/.cache/isoline-tools/llvm-mc-${{ steps.llvm-mc-key.outputs.version }}-x86_64-linux
          key: llvm-mc-${{ hashFiles('scripts/tools.lock') }}
      - name: Fetch and check the pinned llvm-mc
        run: |
          set -euo pipefail
          llvm_mc=$(python3 -I scripts/fetch-tools.py --tool llvm-mc)
          python3 -I scripts/fetch-tools.py --check-version "$llvm_mc" --tool llvm-mc
          python3 -I scripts/fetch-tools.py --check-libraries "$llvm_mc"
          echo "ISOLINE_LLVM_MC=$llvm_mc" >> "$GITHUB_ENV"
      - name: Configure
        # clang-tidy runs in the ASan job already.
        run: >
          cmake --preset clang-release
          -DCMAKE_CXX_COMPILER="clang++-$LLVM_VERSION"
          -DISOLINE_CLANG_TIDY=OFF
          -DISOLINE_FETCH_DEPS=ON
          -DISOLINE_LLVM_MC="$ISOLINE_LLVM_MC"
      - name: Build
        run: cmake --build --preset clang-release --target isoline_encoding_samples
      - name: Check every encoding against llvm-mc
        run: ctest --test-dir out/clang-release -L oracle --no-tests=error --output-on-failure

  # arm64 from an x86-64 host, as a developer runs it locally (docs/cross-compiling.md): the cross toolchain
  # and sysroot, and the suite under qemu on the baseline ARMv8.0 core, where PAC and BTI are NOPs. The
  # sysroot is cached by the script that pins its image; the oracle is target-independent and runs above.
  linux-arm64-qemu-smoke:
    name: Linux arm64 cross (qemu, cortex-a53)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }}, Ninja and qemu-user
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy ninja-build qemu-user-static podman
          # The toolchain file finds clang, clang++ and ld.lld by their plain names.
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
      - name: Restore the sysroot
        uses: actions/cache@v4
        with:
          path: ~/.cache/isoline/sysroot-aarch64-trixie
          key: sysroot-aarch64-${{ hashFiles('scripts/make-aarch64-sysroot.sh') }}
      - name: Create the sysroot
        run: scripts/make-aarch64-sysroot.sh
      - name: Build and test under qemu
        run: scripts/arm64-cross.sh --cpu cortex-a53 -- -L unit -LE oracle --no-tests=error

  macos-clang:
    name: macOS Apple Clang
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset macos-clang
      - name: Build
        run: cmake --build --preset macos-clang
      - name: Test
        run: ctest --preset macos-clang --output-on-failure

  # One row per Windows architecture: x64 runs the whole suite, ARM64 (tier 2) the unit label.
  windows-msvc:
    name: Windows MSVC${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64, suffix: "", tests: "" }
          - { runner: windows-11-arm, arch: arm64, suffix: " ARM64", tests: "-L unit" }
    steps:
      - uses: actions/checkout@v4
      - name: Enter the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Configure
        run: cmake --preset msvc-debug
      - name: Build
        run: cmake --build --preset msvc-debug
      - name: Test
        run: ctest --preset msvc-debug --output-on-failure --no-tests=error ${{ matrix.tests }}

  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format ${{ env.LLVM_VERSION }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -qy "clang-format-$LLVM_VERSION"
      - name: Check formatting
        run: |
          dirs=()
          for dir in src tests; do
            if [ -d "$dir" ]; then dirs+=("$dir"); fi
          done
          find "${dirs[@]}" \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 "clang-format-$LLVM_VERSION" --dry-run --Werror

  vendor-check:
    name: Vendored core-cpp matches its MANIFEST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check vendor/core-cpp
        run: cmake -DMODE=check -DDEST=vendor/core-cpp -P vendor/core-cpp/cmake/CoreCppVendor.cmake
